<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Access — Karama Data</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --surface2:  #1a2236;
      --border:    #1e2d4a;
      --accent:    #2563eb;
      --accent-h:  #3b82f6;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --error:     #ef4444;
      --success:   #22c55e;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    /* subtle grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(37,99,235,.08);
      position: relative;
    }

    /* ── Lock screen ── */
    #lock-screen { text-align: center; }

    .lock-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #1e3a6e, #2563eb33);
      border: 1px solid #2563eb55;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-icon svg { width: 36px; height: 36px; }

    #lock-screen h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    #lock-screen p {
      font-size: .875rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 8px;
    }

    .input-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 44px 12px 14px;
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      letter-spacing: .08em;
    }

    .input-wrap input:focus { border-color: var(--accent); }

    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      padding: 4px;
    }

    .toggle-eye:hover { color: var(--text); }

    .error-msg {
      font-size: .8rem;
      color: var(--error);
      min-height: 20px;
      margin-bottom: 14px;
      text-align: left;
      padding-left: 2px;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:active { transform: scale(.98); }

    /* ── Credentials screen ── */
    #creds-screen { display: none; }

    .creds-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .shield-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1e3a6e, #2563eb44);
      border: 1px solid #2563eb55;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .shield-icon svg { width: 22px; height: 22px; }

    .creds-header-text h2 { font-size: 1.1rem; font-weight: 700; }
    .creds-header-text span { font-size: .8rem; color: var(--muted); }

    .field-list { display: flex; flex-direction: column; gap: 12px; }

    .field {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .field-label {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-value {
      flex: 1;
      font-size: .88rem;
      color: var(--text);
      word-break: break-all;
      font-family: 'Consolas', 'Menlo', monospace;
    }

    .copy-btn {
      flex-shrink: 0;
      background: rgba(37,99,235,.15);
      border: 1px solid rgba(37,99,235,.3);
      border-radius: 7px;
      color: var(--accent-h);
      font-size: .75rem;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: rgba(37,99,235,.3); }
    .copy-btn.copied { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.3); color: var(--success); }

    .lock-again {
      margin-top: 24px;
      text-align: center;
    }

    .lock-again button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: .8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .lock-again button:hover { color: var(--text); }
  </style>
</head>
<body>
<div class="card">

  <!-- Lock screen -->
  <div id="lock-screen">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Secure Access</h1>
    <p>Enter your passkey to view server credentials</p>

    <div class="input-wrap">
      <input type="password" id="passkey-input" placeholder="Enter passkey…" autocomplete="off" />
      <button class="toggle-eye" onclick="toggleEye()" title="Show / hide">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <button class="btn-primary" onclick="unlock()">Unlock</button>
  </div>

  <!-- Credentials screen -->
  <div id="creds-screen">
    <div class="creds-header">
      <div class="shield-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="creds-header-text">
        <h2>Server Credentials</h2>
        <span>Karama Data — karamadata.ai</span>
      </div>
    </div>

    <div class="field-list" id="field-list"></div>

    <div class="lock-again">
      <button onclick="lockScreen()">Lock &amp; clear</button>
    </div>
  </div>

</div>

<script>
  // ── Passkey (sourced from .env.credentials: CREDENTIALS_PASSKEY) ──
  const PASSKEY = 'HxNp2UYvvas!5WBL';

  const CREDENTIALS = [
    { label: 'Website URL',  value: 'https://karamadata.ai/' },
    { label: 'cPanel URL',   value: 'https://lv-shared04.cpanelplatform.com:2083/' },
    { label: 'Username',     value: 'karamada75' },
    { label: 'Password',     value: 'hnimqw8eu558fnzs6e.' },
    { label: 'IP Address',   value: '162.244.93.7' },
  ];

  const input    = document.getElementById('passkey-input');
  const errorMsg = document.getElementById('error-msg');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  function unlock() {
    if (input.value === PASSKEY) {
      errorMsg.textContent = '';
      renderCreds();
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('creds-screen').style.display = 'block';
      input.value = '';
    } else {
      errorMsg.textContent = 'Incorrect passkey. Please try again.';
      input.value = '';
      input.focus();
    }
  }

  function renderCreds() {
    const list = document.getElementById('field-list');
    list.innerHTML = '';
    CREDENTIALS.forEach(({ label, value }) => {
      const field = document.createElement('div');
      field.className = 'field';
      field.innerHTML = `
        <div class="field-label">${label}</div>
        <div class="field-row">
          <span class="field-value">${value}</span>
          <button class="copy-btn" onclick="copyVal(this, '${value.replace(/'/g, "\\'")}')">Copy</button>
        </div>`;
      list.appendChild(field);
    });
  }

  function copyVal(btn, val) {
    navigator.clipboard.writeText(val).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function lockScreen() {
    document.getElementById('creds-screen').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'block';
    document.getElementById('field-list').innerHTML = '';
    input.focus();
  }

  function toggleEye() {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
</script>
</body>
</html>
